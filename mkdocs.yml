site_name: Dropsome
site_url: https://docs.dropsome.xyz
repo_url: https://github.com/dropsome-xyz/dropsome-docs
repo_name: dropsome-xyz/dropsome-docs
site_description: Dropsome documentation for creating, claiming, and refunding SOL drops on Solana. Learn how the app works, how the claim link is secured, and how to use the flow safely.
site_author: Dropsome Builders

edit_uri: ''

nav:
  - Overview: index.md
  - Drop: features/drop.md
  - Claim: features/claim.md
  - Refund: features/refund.md
  - Technical:
      - Encryption: technical/encryption.md
      - Solana Program: technical/program.md
  - Privacy Policy: legal/privacy-policy.md
  - Terms of Service: legal/terms-of-service.md
  - Security Disclaimer: legal/security-disclaimer.md

theme:
  name: material
  logo: "images/logo192.png"
  favicon: "images/favicon.ico"
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  features:
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.integrate
    - toc.follow
  use_directory_urls: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dropsome-xyz
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/dropsome_xyz
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/dropsome
    - name: Ask AI with Perplexity
      icon: custom/perplexity
      link: "https://www.perplexity.ai/search?q=Explain%20what%20Dropsome%20does%20and%20answer%20my%20questions%20about%20its%20features%20and%20how%20to%20use%20it.%20Read%20https%3A%2F%2Fdocs.dropsome.xyz%2Fllms-full.txt%20for%20the%20full%20documentation.%20Answer%20in%20English."
  meta:
    description: "Dropsome is a decentralized finance (DeFi) app that allows users to share a small amount of SOL with someone who doesn't have a wallet. By generating a wallet and a secure link, the sender can easily drop SOL for a receiver to claim, without requiring them to have a wallet initially. The receiver then connects their wallet to the claim page and the claim happens automatically."
    keywords: "Dropsome, DeFi app,share SOL, transfer SOL, Solana wallet, wallet app"
    author: "Dropsome"

plugins:
  - search
  - macros
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: false
  - social:
      cards_layout_options:
        background_color: "#000000"

hooks:
  - hooks/llms.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js